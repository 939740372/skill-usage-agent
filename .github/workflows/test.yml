name: collector-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: usage/collector/package-lock.json
      - run: npm ci
        working-directory: usage/collector
      - run: npm test
        working-directory: usage/collector

